name: Optional Codex Runtime

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.codex.yml'
      - 'packages/server/src/codexAuth*'
      - '.github/workflows/codex-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.github/workflows/codex-runtime.yml'

permissions:
  contents: read

jobs:
  codex-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build and check the optional runtime on both architectures
        uses: docker/build-push-action@v5
        with:
          context: .
          target: codex
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=codex-runtime
          cache-to: type=gha,scope=codex-runtime,mode=max
